<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Board | Haskell United Way</title>

<link rel="stylesheet" href="style.css">

<style>

.board-header{
    text-align:center;
    margin:30px 0;
}

.board-header h1{
    color:#4f2683;
}

.claim-modal{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.75);
    justify-content:center;
    align-items:center;
    z-index:1000;
}

.modal-content{
    background:white;
    width:min(500px,90%);
    padding:24px;
    border-radius:16px;
}

.modal-content h2{
    margin-bottom:20px;
}

.close-btn{
    float:right;
    cursor:pointer;
    font-size:20px;
}

.select-theme{
    width:100%;
}

.board-legend{
    display:flex;
    justify-content:center;
    gap:16px;
    flex-wrap:wrap;
    margin-bottom:20px;
}

.legend-item{
    background:white;
    padding:8px 14px;
    border-radius:10px;
    box-shadow:0 2px 6px rgba(0,0,0,.1);
}

</style>

</head>

<body>

<header class="site-header">

    <div class="container">

        <div class="logo-row">
            <h1>🏈 Haskell United Way</h1>
            <p>Vikings vs Saints Test Game</p>
        </div>

        <nav class="main-nav">
    <a href="index.html">Home</a>
    <a href="board.html">Board</a>
    <a href="cards.html">Trading Cards</a>
    <a href="halloffame.html">Hall of Fame</a>
    <a href="admin.html">Admin</a>
</nav>

    </div>

</header>

<main class="container">

    <div class="board-header">

        <h1>
            🟣 Minnesota Vikings
            vs
            ⚜️ New Orleans Saints
        </h1>

        <p>
            Click any open square to claim it.
        </p>

    </div>

<div class="current-player-card">

    <div id="currentPlayerInfo">

        <strong>
            No Active Player
        </strong>

        <br>

        Create a trading card by claiming
        your first square.

    </div>

</div>
    <div id="board" class="board"></div>

</main>

<!-- Modal -->

<div id="claimModal" class="claim-modal">

    <div class="modal-content">

        <span
            class="close-btn"
            onclick="closeModal()">
            ✖
        </span>

        <h2>Claim Square</h2>

        <form id="claimForm">

            <label>
                Name
            </label>

            <input
                id="playerName"
                required>

            <label>
                Nickname
            </label>

            <input
                id="nickname">

            <label>
                Department
            </label>

            <input
                id="department">

            <label>
    Favorite NFL Team
</label>

<select
    id="avatar"
    class="select-theme">

    <option value="ARI">Arizona Cardinals</option>
    <option value="ATL">Atlanta Falcons</option>
    <option value="BAL">Baltimore Ravens</option>
    <option value="BUF">Buffalo Bills</option>
    <option value="CAR">Carolina Panthers</option>
    <option value="CHI">Chicago Bears</option>
    <option value="CIN">Cincinnati Bengals</option>
    <option value="CLE">Cleveland Browns</option>
    <option value="DAL">Dallas Cowboys</option>
    <option value="DEN">Denver Broncos</option>
    <option value="DET">Detroit Lions</option>
    <option value="GB">Green Bay Packers</option>
    <option value="HOU">Houston Texans</option>
    <option value="IND">Indianapolis Colts</option>
    <option value="JAX">Jacksonville Jaguars</option>
    <option value="KC">Kansas City Chiefs</option>
    <option value="LV">Las Vegas Raiders</option>
    <option value="LAC">Los Angeles Chargers</option>
    <option value="LAR">Los Angeles Rams</option>
    <option value="MIA">Miami Dolphins</option>
    <option value="MIN">Minnesota Vikings</option>
    <option value="NE">New England Patriots</option>
    <option value="NO">New Orleans Saints</option>
    <option value="NYG">New York Giants</option>
    <option value="NYJ">New York Jets</option>
    <option value="PHI">Philadelphia Eagles</option>
    <option value="PIT">Pittsburgh Steelers</option>
    <option value="SF">San Francisco 49ers</option>
    <option value="SEA">Seattle Seahawks</option>
    <option value="TB">Tampa Bay Buccaneers</option>
    <option value="TEN">Tennessee Titans</option>
    <option value="WAS">Washington Commanders</option>

</select>

            <button
                type="submit"
                class="btn-primary">
                Claim Square
            </button>

        </form>

    </div>

</div>

<script type="module">

import {
    createPlayer,
    claimSquare,
    watchSquares
}
from "./js/firebase.js";

const board =
    document.getElementById("board");

const modal =
    document.getElementById(
        "claimModal"
    );

let selectedSquare = null;

function openModal(squareId){

    selectedSquare =
        squareId;

    modal.style.display =
        "flex";

}

window.closeModal = function(){

    modal.style.display =
        "none";

}

watchSquares(renderBoard);

function renderBoard(squares){

    board.innerHTML = "";

    squares.sort((a,b)=>{

        const rowDiff =
            a.row - b.row;

        if(rowDiff !== 0){

            return rowDiff;

        }

        return a.col - b.col;

    });

    squares.forEach(square => {

        const div =
            document.createElement(
                "div"
            );

        if(square.claimed){

            const teamClass =
                square.avatar
                ? `team-${square.avatar.toLowerCase()}`
                : "";

            div.className =
                `square claimed ${teamClass}`;

            div.innerHTML = `
                <div class="square-nickname">
                    ${square.displayName}
                </div>
            `;

        }

        else{

            div.className =
                "square";

            div.innerHTML =
                "<strong>+</strong>";

            div.addEventListener(
                "click",
                () =>
                    openModal(
                        square.id
                    )
            );

        }

        board.appendChild(div);

    });

}

document
.getElementById(
    "claimForm"
)
.addEventListener(
    "submit",
    async e => {

        e.preventDefault();

        try{

            const name =
                document
                .getElementById(
                    "playerName"
                )
                .value
                .trim();

            const nickname =
                document
                .getElementById(
                    "nickname"
                )
                .value
                .trim();

            const department =
                document
                .getElementById(
                    "department"
                )
                .value
                .trim();

            const avatar =
                document
                .getElementById(
                    "avatar"
                )
                .value;

            const playerId =
                await createPlayer({

                    name,

                    nickname,

                    department,

                    avatar,

                    created:
                        new Date()
                        .toISOString()

                });

            await claimSquare(
    selectedSquare,
    playerId,
    nickname || name,
    avatar,
);

            closeModal();

            document
            .getElementById(
                "claimForm"
            )
            .reset();

        }

        catch(error){

            console.error(
                error
            );

            alert(
                "Unable to claim square."
            );

        }

    }
);

</script>

</body>
</html>
